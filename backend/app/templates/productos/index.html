{% extends "base.html" %}

{% block title %}Productos - Sistema Comercial{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Productos</h1>
        <div class="flex gap-2">
            <a href="/app/productos/export" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
                Exportar Excel
            </a>
            <button 
                hx-get="/app/productos/form"
                hx-target="#modal-container"
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded"
            >
                + Nuevo Producto
            </button>
        </div>
    </div>
    
    <!-- Buscador -->
    <div class="bg-white p-4 rounded-lg shadow mb-4">
        <div class="flex gap-4">
            <input 
                type="text" 
                id="search-input"
                placeholder="Buscar productos..."
                class="flex-1 border rounded px-4 py-2"
            >
            <button 
                id="search-btn"
                class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded"
            >
                Buscar
            </button>
            <button 
                id="clear-btn"
                class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded"
            >
                Limpiar
            </button>
        </div>
    </div>
    
    <!-- Tabla -->
    <div 
        id="table-container" 
        hx-get="/app/productos/table?page=1&size=20"
        hx-trigger="load, refreshTable from:body"
        hx-swap="innerHTML"
    >
        <div class="text-center py-8">Cargando...</div>
    </div>
</div>

<!-- Modal para formulario (se inyecta dinámicamente) -->
<div id="modal-container"></div>

<script>
    // Listener para búsqueda
    document.getElementById('search-btn').addEventListener('click', function() {
        const search = document.getElementById('search-input').value;
        const tableContainer = document.getElementById('table-container');
        htmx.ajax('GET', `/app/productos/table?page=1&size=20&search=${encodeURIComponent(search)}`, {
            target: '#table-container',
            swap: 'innerHTML'
        });
    });
    
    // Limpiar búsqueda
    document.getElementById('clear-btn').addEventListener('click', function() {
        document.getElementById('search-input').value = '';
        const tableContainer = document.getElementById('table-container');
        htmx.ajax('GET', '/app/productos/table?page=1&size=20', {
            target: '#table-container',
            swap: 'innerHTML'
        });
    });
    
    // Enter para buscar
    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('search-btn').click();
        }
    });
</script>
{% endblock %}
