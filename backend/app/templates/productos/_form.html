<!-- Modal para formulario de producto -->
<div 
    id="producto-modal" 
    class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
    x-data="{ open: true }"
    x-show="open"
    @click.self="open = false; document.getElementById('modal-container').innerHTML = ''"
>
    <div class="relative top-20 mx-auto p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold text-gray-900">
                {% if producto %}Editar Producto{% else %}Nuevo Producto{% endif %}
            </h3>
            <button 
                @click="open = false; document.getElementById('modal-container').innerHTML = ''"
                class="text-gray-400 hover:text-gray-500"
            >
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Formulario -->
        <form 
            hx-post="/app/productos/save" 
            hx-target="#modal-container"
            hx-swap="innerHTML"
        >
            {% if producto %}
            <input type="hidden" name="id" value="{{ producto.id }}">
            {% endif %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Nombre -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Nombre <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        name="nombre" 
                        value="{{ producto.nombre if producto else '' }}"
                        required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <!-- Código -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Código</label>
                    <input 
                        type="text" 
                        name="codigo" 
                        value="{{ producto.codigo if producto else '' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <!-- Categoría -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                    <input 
                        type="text" 
                        name="categoria" 
                        value="{{ producto.categoria if producto else '' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <!-- Descripción -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                    <textarea 
                        name="descripcion" 
                        rows="3"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >{{ producto.descripcion if producto else '' }}</textarea>
                </div>
                
                <!-- Precio -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Precio <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="number" 
                        name="precio" 
                        step="0.01"
                        value="{{ producto.precio if producto else '0.00' }}"
                        required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <!-- Costo -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Costo</label>
                    <input 
                        type="number" 
                        name="costo" 
                        step="0.01"
                        value="{{ producto.costo if producto else '0.00' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <!-- Stock -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
                    <input 
                        type="number" 
                        name="stock" 
                        value="{{ producto.stock if producto else '0' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <!-- Stock Mínimo -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Stock Mínimo</label>
                    <input 
                        type="number" 
                        name="stock_minimo" 
                        value="{{ producto.stock_minimo if producto else '0' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <!-- Activo -->
                <div class="md:col-span-2">
                    <label class="flex items-center">
                        <input 
                            type="checkbox" 
                            name="activo" 
                            value="true"
                            {% if not producto or producto.activo %}checked{% endif %}
                            class="mr-2"
                        >
                        <span class="text-sm font-medium text-gray-700">Activo</span>
                    </label>
                </div>
            </div>
            
            <!-- Botones -->
            <div class="mt-6 flex justify-end gap-2">
                <button 
                    type="button"
                    @click="open = false; document.getElementById('modal-container').innerHTML = ''"
                    class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400"
                >
                    Cancelar
                </button>
                <button 
                    type="submit"
                    class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                >
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
