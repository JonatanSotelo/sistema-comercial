{% extends "base.html" %}
{% block content %}
<h1>Ventas</h1>

<div class="search">
  <input id="ventas-q" type="search" placeholder="Buscar..." name="q"
         hx-get="/app/ventas/table"
         hx-trigger="keyup changed delay:300ms"
         hx-target="#tabla"
         hx-include="#ventas-q,#ventas-size">
  <select id="ventas-size" name="size"
          hx-get="/app/ventas/table"
          hx-trigger="change"
          hx-target="#tabla"
          hx-include="#ventas-q,#ventas-size">
    <option value="10">10</option>
    <option value="20" selected>20</option>
    <option value="50">50</option>
  </select>
  <button class="btn"
          hx-get="/app/ventas/form/new"
          hx-target="#form-container"
          hx-swap="innerHTML">Nueva Venta</button>
</div>

<div id="form-container"></div>

<!-- Contenedor para formulario de cobro -->
<div id="cobro-container"></div>

<div id="tabla" hx-get="/app/ventas/table" hx-trigger="load">
  Cargando…
</div>
{% endblock %}
