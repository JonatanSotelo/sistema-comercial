{% extends "base.html" %}

{% block title %}Página no encontrada - 404{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="max-w-md w-full bg-white shadow-lg rounded-lg p-8 text-center">
        <div class="mb-4">
            <svg class="mx-auto h-24 w-24 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        
        <h1 class="text-4xl font-bold text-gray-800 mb-2">404</h1>
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">Página no encontrada</h2>
        
        <p class="text-gray-600 mb-6">
            {{ detail or "La página que buscas no existe o fue movida." }}
        </p>
        
        <div class="flex gap-4 justify-center">
            <a href="/app/dashboard" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded">
                Ir al Dashboard
            </a>
            <a href="/app" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded">
                Ir al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
