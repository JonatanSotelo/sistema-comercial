{% extends "base.html" %}

{% block title %}Libro IVA Compras{% endblock %}

{% block content %}
<div class="container">
  <h1>Libro IVA Compras</h1>
  <p class="text-muted">Carga manual de facturas de compras para Libro IVA</p>
  
  <div class="card">
    <div class="card-body">
      <!-- Botones de acción -->
      <div class="mb-3 d-flex justify-content-between">
        <button class="btn btn-success" 
                hx-get="/app/iva-compras/form-nuevo"
                hx-target="#form-container">
          ➕ Nueva Factura Compra
        </button>
        
        <div>
          <a href="/reportes/libro-iva-compras?format=csv" 
             class="btn btn-outline-primary">
            📥 Descargar CSV
          </a>
          <a href="/reportes/libro-iva-compras?format=xlsx" 
             class="btn btn-outline-success">
            📊 Descargar Excel
          </a>
        </div>
      </div>

      <!-- Formulario dinámico -->
      <div id="form-container"></div>

      <!-- Tabla de registros -->
      <div id="tabla-container" 
           hx-get="/app/iva-compras/table" 
           hx-trigger="load"
           hx-swap="innerHTML">
        <p class="text-center text-muted">Cargando registros...</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
