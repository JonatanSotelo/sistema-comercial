<div class="flash" style="margin-top:.5rem">
  <strong>Nueva Compra</strong>
</div>

{% if error %}
<div class="flash error" style="margin:.5rem 0">{{ error }}</div>
{% endif %}

<form
  id="compra-form"
  hx-post="/app/compras/create"
  hx-target="#tabla"
  hx-swap="outerHTML"
  hx-include="[name='proveedor_id'], [name='producto_id'], [name='cantidad'], [name='costo_unitario']:not([data-lookup-field])"
  style="display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;max-width:900px;margin:.5rem 0 1rem 0"
>
  <label style="grid-column:1/-1;position:relative">
    Proveedor
    <input type="text"
           id="proveedor-search"
           placeholder="Buscar proveedor..."
           autocomplete="off"
           hx-get="/app/compras/lookup/proveedor"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#proveedor-results"
           hx-swap="innerHTML"
           hx-include="this"
           name="q"
           data-lookup-field>
    <input type="hidden" id="proveedor_id" name="proveedor_id" value="{{ compra.proveedor_id or '' }}" required>
    <div id="proveedor-results" style="position:absolute;background:white;border:1px solid #ddd;max-height:200px;overflow-y:auto;z-index:1000;display:none"></div>
  </label>

  <div style="grid-column:1/-1">
    <h3>Ítems</h3>
    <table class="table" id="items-table">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Costo Unit.</th>
          <th>Subtotal</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="items-tbody">
        <tr class="item-row" data-item-index="0">
          <td style="position:relative">
            <input type="text"
                   class="producto-search"
                   placeholder="Buscar producto..."
                   autocomplete="off"
                   hx-get="/app/compras/lookup/producto"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#producto-results-0"
                   hx-swap="innerHTML"
                   hx-include="this"
                   name="q"
                   data-lookup-field
                   onfocus="document.getElementById('producto-results-0').style.display='block'"
                   onblur="setTimeout(() => document.getElementById('producto-results-0').style.display='none', 200)">
            <input type="hidden" class="producto_id" name="producto_id" value="">
            <div id="producto-results-0" class="producto-results" style="position:absolute;background:white;border:1px solid #ddd;max-height:200px;overflow-y:auto;z-index:1000;display:none;top:100%;left:0;right:0"></div>
            <div style="margin-top:.25rem">
              <span class="producto-nombre" style="font-weight:bold"></span>
              <span class="producto-stock" style="font-size:.8em;color:#666;margin-left:.5rem"></span>
            </div>
          </td>
          <td>
            <input type="number" class="cantidad" name="cantidad" value="1" min="1" step="1" required oninput="calcularTotal()">
          </td>
          <td>
            <input type="number" class="costo_unitario" name="costo_unitario" value="0" min="0" step="0.01" required oninput="calcularTotal()">
          </td>
          <td>
            <span class="subtotal">0.00</span>
          </td>
          <td>
            <button type="button" class="btn" onclick="this.closest('tr').remove(); calcularTotal();">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
    <button type="button" class="btn" onclick="agregarItem();" style="margin-top:.5rem">+ Agregar Ítem</button>
  </div>

  <div style="grid-column:1/-1;text-align:right;font-size:1.2em;font-weight:bold;padding-top:1rem;border-top:2px solid #ddd">
    Total: <span id="total">0.00</span>
  </div>

  <div>
    <button class="btn" type="submit">Guardar</button>
  </div>
  <div>
    <button class="btn" type="button"
            onclick="document.getElementById('form-container').innerHTML='';">Cancelar</button>
  </div>
</form>

<script>
let itemIndex = 1;

function agregarItem() {
  const tbody = document.getElementById('items-tbody');
  const firstRow = tbody.querySelector('.item-row');
  const row = firstRow.cloneNode(true);
  
  // Actualizar IDs y atributos
  const index = itemIndex++;
  row.setAttribute('data-item-index', index);
  const productoSearch = row.querySelector('.producto-search');
  const productoResults = row.querySelector('.producto-results');
  productoSearch.id = `producto-search-${index}`;
  productoResults.id = `producto-results-${index}`;
  productoSearch.setAttribute('hx-target', `#producto-results-${index}`);
  productoSearch.setAttribute('hx-include', 'this');
  productoSearch.setAttribute('name', 'q');
  productoSearch.setAttribute('data-lookup-field', '');
  productoSearch.setAttribute('onfocus', `document.getElementById('producto-results-${index}').style.display='block'`);
  productoSearch.setAttribute('onblur', `setTimeout(() => document.getElementById('producto-results-${index}').style.display='none', 200)`);
  
  // Limpiar valores
  row.querySelectorAll('input').forEach(inp => {
    if (inp.type !== 'hidden' && !inp.classList.contains('producto-search')) inp.value = '';
    if (inp.classList.contains('producto_id')) inp.value = '';
    if (inp.classList.contains('cantidad')) inp.value = '1';
    if (inp.classList.contains('costo_unitario')) inp.value = '0';
    if (inp.classList.contains('producto-search')) inp.value = '';
  });
  row.querySelector('.producto-nombre').textContent = '';
  row.querySelector('.producto-stock').textContent = '';
  row.querySelector('.subtotal').textContent = '0.00';
  
  tbody.appendChild(row);
  calcularTotal();
}

function calcularTotal() {
  const rows = document.querySelectorAll('.item-row');
  let total = 0;
  rows.forEach(row => {
    const cantidad = parseFloat(row.querySelector('.cantidad').value) || 0;
    const costo = parseFloat(row.querySelector('.costo_unitario').value) || 0;
    const subtotal = cantidad * costo;
    row.querySelector('.subtotal').textContent = subtotal.toFixed(2);
    total += subtotal;
  });
  document.getElementById('total').textContent = total.toFixed(2);
}

// Autocomplete proveedor - mostrar resultados cuando HTMX los actualiza
document.addEventListener('htmx:afterSwap', function(event) {
  if (event.detail.target.id === 'proveedor-results') {
    if (event.detail.target.innerHTML.trim()) {
      event.detail.target.style.display = 'block';
    }
  }
  // Productos
  if (event.detail.target.classList.contains('producto-results')) {
    if (event.detail.target.innerHTML.trim()) {
      event.detail.target.style.display = 'block';
    }
  }
});

// Ocultar resultados cuando se hace clic fuera
document.addEventListener('click', function(e) {
  if (!e.target.closest('#proveedor-search') && !e.target.closest('#proveedor-results')) {
    document.getElementById('proveedor-results').style.display = 'none';
  }
  if (!e.target.closest('.producto-search') && !e.target.closest('.producto-results')) {
    document.querySelectorAll('.producto-results').forEach(r => r.style.display = 'none');
  }
});
</script>

<style>
.item-row td {
  position: relative;
}
.producto-results, #proveedor-results {
  display: none;
  max-width: 300px;
}
.producto-results.show, #proveedor-results.show {
  display: block;
}
</style>
