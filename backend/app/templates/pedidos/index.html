{% extends "base.html" %}

{% block content %}
<h1>Pedidos</h1>

<div class="search">
  <input type="text" id="search-input" placeholder="Buscar..." value="" style="flex:1;padding:.5rem">
  <select id="estado-filter" style="padding:.5rem">
    <option value="">Todos los estados</option>
    <option value="NUEVO">Nuevo</option>
    <option value="EN_PREPARACION">En Preparación</option>
    <option value="LISTO">Listo</option>
    <option value="FACTURADO">Facturado</option>
    <option value="CANCELADO">Cancelado</option>
  </select>
  <button class="btn" id="search-btn">Buscar</button>
  <button class="btn" hx-get="/app/pedidos/form/new" hx-target="#form-container" hx-swap="innerHTML">
    Nuevo Pedido
  </button>
</div>

<div id="form-container"></div>

<div id="tabla"
     hx-get="/app/pedidos/table"
     hx-trigger="load"
     hx-swap="outerHTML">
  Cargando...
</div>

<script>
  const searchInput = document.getElementById('search-input');
  const estadoFilter = document.getElementById('estado-filter');
  const searchBtn = document.getElementById('search-btn');
  
  function buscar() {
    const q = searchInput.value;
    const estado = estadoFilter.value;
    const url = `/app/pedidos/table?q=${encodeURIComponent(q)}&estado=${encodeURIComponent(estado)}`;
    htmx.ajax('GET', url, {target: '#tabla', swap: 'outerHTML'});
  }
  
  searchBtn.addEventListener('click', buscar);
  searchInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') buscar();
  });
  estadoFilter.addEventListener('change', buscar);
</script>
{% endblock %}
