{% extends "base.html" %}
{% block content %}
<h1>Auditoría</h1>

<div class="search" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem;margin-bottom:1rem">
  <input id="q" type="search" placeholder="Buscar en detalle..." name="q"
         hx-get="/app/auditoria/table"
         hx-trigger="keyup changed delay:300ms"
         hx-target="#tabla"
         hx-include="#q,#size,#fecha_desde,#fecha_hasta,#table_name,#action,#username,#record_id">
  
  <input id="fecha_desde" type="date" name="fecha_desde" placeholder="Desde"
         hx-get="/app/auditoria/table"
         hx-trigger="change"
         hx-target="#tabla"
         hx-include="#q,#size,#fecha_desde,#fecha_hasta,#table_name,#action,#username,#record_id">
  
  <input id="fecha_hasta" type="date" name="fecha_hasta" placeholder="Hasta"
         hx-get="/app/auditoria/table"
         hx-trigger="change"
         hx-target="#tabla"
         hx-include="#q,#size,#fecha_desde,#fecha_hasta,#table_name,#action,#username,#record_id">
  
  <select id="table_name" name="table_name" placeholder="Módulo"
          hx-get="/app/auditoria/table"
          hx-trigger="change"
          hx-target="#tabla"
          hx-include="#q,#size,#fecha_desde,#fecha_hasta,#table_name,#action,#username,#record_id">
    <option value="">Todos los módulos</option>
    <option value="productos">Productos</option>
    <option value="clientes">Clientes</option>
    <option value="proveedores">Proveedores</option>
    <option value="ventas">Ventas</option>
    <option value="compras">Compras</option>
    <option value="stock">Stock</option>
  </select>
  
  <select id="action" name="action" placeholder="Acción"
          hx-get="/app/auditoria/table"
          hx-trigger="change"
          hx-target="#tabla"
          hx-include="#q,#size,#fecha_desde,#fecha_hasta,#table_name,#action,#username,#record_id">
    <option value="">Todas las acciones</option>
    <option value="CREATE">CREATE</option>
    <option value="UPDATE">UPDATE</option>
    <option value="DELETE">DELETE</option>
    <option value="ADJUST">ADJUST</option>
    <option value="LOGIN">LOGIN</option>
    <option value="LOGOUT">LOGOUT</option>
  </select>
  
  <input id="username" type="text" name="username" placeholder="Usuario"
         hx-get="/app/auditoria/table"
         hx-trigger="keyup changed delay:300ms"
         hx-target="#tabla"
         hx-include="#q,#size,#fecha_desde,#fecha_hasta,#table_name,#action,#username,#record_id">
  
  <input id="record_id" type="text" name="record_id" placeholder="ID Entidad"
         hx-get="/app/auditoria/table"
         hx-trigger="keyup changed delay:300ms"
         hx-target="#tabla"
         hx-include="#q,#size,#fecha_desde,#fecha_hasta,#table_name,#action,#username,#record_id">
  
  <select id="size" name="size"
          hx-get="/app/auditoria/table"
          hx-trigger="change"
          hx-target="#tabla"
          hx-include="#q,#size,#fecha_desde,#fecha_hasta,#table_name,#action,#username,#record_id">
    <option value="10">10</option>
    <option value="20" selected>20</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>
</div>

<div id="tabla" hx-get="/app/auditoria/table" hx-trigger="load">
  Cargando…
</div>
{% endblock %}
