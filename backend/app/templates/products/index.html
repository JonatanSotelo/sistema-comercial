
{% extends "base.html" %}
{% block content %}
<h1>Productos</h1>

<div class="search">
  <input id="q" type="search" placeholder="Buscar..." name="q"
         hx-get="/app/productos/table"
         hx-trigger="keyup changed delay:300ms"
         hx-target="#tabla"
         hx-include="#q,#size"
  >
  <select id="size" name="size"
          hx-get="/app/productos/table"
          hx-trigger="change"
          hx-target="#tabla"
          hx-include="#q,#size">
    <option value="10">10</option>
    <option value="20" selected>20</option>
    <option value="50">50</option>
  </select>
  <button class="btn"
          hx-get="/app/productos/form/new"
          hx-target="#form-container"
          hx-swap="innerHTML">Nuevo</button>
      <a class="btn" href="/app/productos/export?format=csv">Export CSV</a>
      <a class="btn" href="/app/productos/export?format=xlsx">Export XLSX</a>
      <button class="btn" onclick="mostrarImportProductos()">Importar</button>
    </div>
    
    <div id="import-container-productos" style="display:none;margin:1rem 0;padding:1rem;background:#f5f5f5;border-radius:.5rem">
      <h3>Importar Productos</h3>
      <form id="import-form-productos" 
            hx-post="/app/productos/import-action" 
            hx-target="#import-preview-productos"
            hx-encoding="multipart/form-data">
        <input type="file" name="file" accept=".csv,.xlsx" required>
        <button type="submit" class="btn">Vista Previa (dry-run)</button>
      </form>
      <div id="import-preview-productos"></div>
    </div>
    
    <script>
    function mostrarImportProductos() {
      const container = document.getElementById('import-container-productos');
      container.style.display = container.style.display === 'none' ? 'block' : 'none';
    }
    </script>

<div id="form-container"></div>

<div id="tabla" hx-get="/app/productos/table" hx-trigger="load">
  Cargando…
</div>
{% endblock %}
