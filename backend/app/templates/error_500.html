{% extends "base.html" %}

{% block title %}Error del Servidor - 500{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="max-w-md w-full bg-white shadow-lg rounded-lg p-8 text-center">
        <div class="mb-4">
            <svg class="mx-auto h-24 w-24 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        
        <h1 class="text-4xl font-bold text-gray-800 mb-2">500</h1>
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">Error del Servidor</h2>
        
        <p class="text-gray-600 mb-6">
            {{ detail or "Algo salió mal en el servidor. Estamos trabajando para solucionarlo." }}
        </p>
        
        <div class="flex gap-4 justify-center">
            <a href="/app/dashboard" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded">
                Ir al Dashboard
            </a>
            <button onclick="location.reload()" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded">
                Reintentar
            </button>
        </div>
    </div>
</div>
{% endblock %}
