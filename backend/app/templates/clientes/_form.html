<!-- Modal para formulario de cliente -->
<div 
    id="cliente-modal" 
    class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
    x-data="{ open: true }"
    x-show="open"
    @click.self="open = false; document.getElementById('modal-container').innerHTML = ''"
>
    <div class="relative top-20 mx-auto p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold text-gray-900">
                {% if cliente %}Editar Cliente{% else %}Nuevo Cliente{% endif %}
            </h3>
            <button 
                @click="open = false; document.getElementById('modal-container').innerHTML = ''"
                class="text-gray-400 hover:text-gray-500"
            >
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <form 
            hx-post="/app/clientes/save" 
            hx-target="#modal-container"
            hx-swap="innerHTML"
        >
            {% if cliente %}
            <input type="hidden" name="id" value="{{ cliente.id }}">
            {% endif %}
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Nombre <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        name="nombre" 
                        value="{{ cliente.nombre if cliente else '' }}"
                        required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input 
                        type="email" 
                        name="email" 
                        value="{{ cliente.email if cliente else '' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <input 
                        type="text" 
                        name="telefono" 
                        value="{{ cliente.telefono if cliente else '' }}"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-2">
                <button 
                    type="button"
                    @click="open = false; document.getElementById('modal-container').innerHTML = ''"
                    class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400"
                >
                    Cancelar
                </button>
                <button 
                    type="submit"
                    class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                >
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
