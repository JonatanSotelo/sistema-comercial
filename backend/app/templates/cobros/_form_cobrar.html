<div id="form-cobrar" class="card">
  <div class="card-header">
    <h5>Cobrar Venta #{{ venta.id }}</h5>
  </div>
  <div class="card-body">
    <form hx-post="/cobros" 
          hx-target="#tabla-container"
          hx-swap="innerHTML">
      
      <input type="hidden" name="venta_id" value="{{ venta.id }}">
      
      <div class="row mb-3">
        <div class="col-md-6">
          <label><b>Total Venta:</b></label>
          <p class="h4">${{ "%.2f"|format(venta.total) }}</p>
        </div>
        <div class="col-md-6">
          <label><b>Saldo Pendiente:</b></label>
          <p class="h4 text-{{ 'danger' if saldo > 0 else 'success' }}">${{ "%.2f"|format(saldo) }}</p>
        </div>
      </div>
      
      <div class="mb-3">
        <label>Importe a Cobrar *</label>
        <input type="number" name="importe" class="form-control" 
               step="0.01" min="0.01" max="{{ saldo }}" 
               value="{{ saldo }}" required>
      </div>
      
      <div class="mb-3">
        <label>Medio de Cobro *</label>
        <select name="medio" class="form-control" required>
          <option value="EFECTIVO">Efectivo</option>
          <option value="TRANSFERENCIA">Transferencia</option>
          <option value="MERCADOPAGO">MercadoPago</option>
          <option value="TARJETA">Tarjeta</option>
          <option value="CHEQUE">Cheque</option>
          <option value="OTRO">Otro</option>
        </select>
      </div>
      
      <div class="mb-3">
        <label>Referencia (Nro. Transferencia, etc.)</label>
        <input type="text" name="referencia" class="form-control">
      </div>
      
      <div class="mb-3">
        <label>Observaciones</label>
        <textarea name="observaciones" class="form-control" rows="2"></textarea>
      </div>
      
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
          💰 Registrar Cobro
        </button>
        <button type="button" class="btn btn-secondary"
                hx-get="/app/cobros/table"
                hx-target="#tabla-container">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
