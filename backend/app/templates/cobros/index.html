{% extends "base.html" %}

{% block title %}Cobros{% endblock %}

{% block content %}
<div class="container">
  <h1>Cobros y Caja</h1>
  <p class="text-muted">Registro de cobros de ventas</p>
  
  <div class="card">
    <div class="card-body">
      <!-- Filtros -->
      <div class="row mb-3">
        <div class="col-md-3">
          <label>Fecha Desde</label>
          <input type="date" class="form-control" id="fecha_desde">
        </div>
        <div class="col-md-3">
          <label>Fecha Hasta</label>
          <input type="date" class="form-control" id="fecha_hasta">
        </div>
        <div class="col-md-2">
          <label>Medio</label>
          <select class="form-control" id="medio">
            <option value="">Todos</option>
            <option value="EFECTIVO">Efectivo</option>
            <option value="TRANSFERENCIA">Transferencia</option>
            <option value="MERCADOPAGO">MercadoPago</option>
            <option value="TARJETA">Tarjeta</option>
            <option value="CHEQUE">Cheque</option>
          </select>
        </div>
        <div class="col-md-2">
          <label>&nbsp;</label>
          <button class="btn btn-primary form-control" 
                  hx-get="/app/cobros/table" 
                  hx-target="#tabla-container"
                  hx-include="[id='fecha_desde'],[id='fecha_hasta'],[id='medio']">
            🔍 Buscar
          </button>
        </div>
      </div>

      <!-- Tabla de cobros -->
      <div id="tabla-container" 
           hx-get="/app/cobros/table" 
           hx-trigger="load"
           hx-swap="innerHTML">
        <p class="text-center text-muted">Cargando cobros...</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
