name: CI - Tests y Linting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Linting y Formato
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Instalar dependencias
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort
      
      - name: Flake8 (Linting)
        run: |
          cd backend
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Black (Formato)
        run: |
          cd backend
          black --check app || echo "⚠️ Código necesita formateo"
      
      - name: isort (Imports)
        run: |
          cd backend
          isort --check-only app || echo "⚠️ Imports necesitan ordenamiento"

  test:
    name: Tests Automatizados
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Instalar dependencias
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar tests
        env:
          DATABASE_URL: postgresql+psycopg2://test_user:test_pass@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin123
        run: |
          cd backend
          pytest tests/ -v --tb=short

  security:
    name: Seguridad
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Instalar dependencias de seguridad
        run: |
          pip install safety bandit
      
      - name: Safety (Vulnerabilidades en dependencias)
        run: |
          cd backend
          safety check --file requirements.txt --json || echo "⚠️ Vulnerabilidades encontradas"
      
      - name: Bandit (Seguridad en código)
        run: |
          cd backend
          bandit -r app -f json -o bandit-report.json || echo "⚠️ Issues de seguridad encontrados"
